name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: CLI smoke test (demo + stats)
        run: |
          python -m meter demo --out dashboard.html
          python -m meter stats --db .meter/demo.db

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
